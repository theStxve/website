<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sigma67.exe</title>

<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
    font-family: Arial, sans-serif;
    color: white;
}

/* ULTRA CHAOS BACKGROUND */
.bg {
    position: absolute;
    inset: -50%;
    background: conic-gradient(
        from 0deg,
        #ff00ff,
        #00ffff,
        #000,
        #ff00ff
    );
    animation: spin 3s linear infinite;
    opacity: 0.12;
    filter: blur(40px);
}

@keyframes spin {
    from { transform: rotate(0deg) scale(1.2); }
    to { transform: rotate(360deg) scale(1.2); }
}

/* static noise layer */
.noise {
    position: absolute;
    inset: 0;
    background: url("https://upload.wikimedia.org/wikipedia/commons/5/5c/Image_gaussian_noise_example.png");
    opacity: 0.08;
    mix-blend-mode: overlay;
    pointer-events: none;
}

/* center */
.wrapper {
    z-index: 2;
    text-align: center;
    animation: flicker 1.8s infinite;
}

@keyframes flicker {
    0%,100% { opacity: 1; }
    50% { opacity: 0.7; }
    55% { opacity: 0.4; }
}

/* TITLE */
h1 {
    font-size: 80px;
    letter-spacing: 15px;
    text-transform: uppercase;
    position: relative;
    animation: shake 0.2s infinite;
}

@keyframes shake {
    0% { transform: translate(0,0); }
    25% { transform: translate(-2px,2px); }
    50% { transform: translate(2px,-2px); }
    75% { transform: translate(-2px,-1px); }
    100% { transform: translate(0,0); }
}

h1::before,
h1::after {
    content: "sigma 67";
    position: absolute;
    left: 0;
    width: 100%;
}

h1::before {
    color: red;
    transform: translate(-4px, 2px);
    clip-path: inset(0 0 50% 0);
}

h1::after {
    color: cyan;
    transform: translate(4px, -2px);
    clip-path: inset(50% 0 0 0);
}

/* LINKS */
.links {
    margin-top: 40px;
}

a {
    display: block;
    margin: 12px;
    font-size: 22px;
    color: white;
    text-decoration: none;
    letter-spacing: 4px;
    transition: 0.2s;
    filter: blur(0.5px);
}

a:hover {
    transform: scale(1.5) rotate(-3deg);
    color: #00ffff;
    text-shadow:
        0 0 10px #ff00ff,
        0 0 20px #00ffff,
        0 0 40px #ff00ff;
    filter: blur(0px);
}

/* cursor glitch trail */
.cursor {
    position: fixed;
    width: 10px;
    height: 10px;
    background: #00ffff;
    border-radius: 50%;
    pointer-events: none;
    mix-blend-mode: difference;
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="noise"></div>

<div class="wrapper">
    <h1>sigma 67</h1>

    <div class="links">
        <a href="https://www.tiktok.com/@thesteve2017">TikTok</a>
        <a href="https://soundcloud.com/stxve17">SoundCloud</a>
        <a href="https://selbsthilfe-hier-buchen.webnode.page/">UNKNOWN</a>
    </div>
</div>

<div class="cursor" id="cursor"></div>

<script>
document.addEventListener("mousemove", e => {
    const c = document.getElementById("cursor");
    c.style.left = e.clientX + "px";
    c.style.top = e.clientY + "px";
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sigma67</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: white;
}

/* dynamischer Chaos-Hintergrund */
body::before {
    content: "";
    position: absolute;
    width: 300%;
    height: 300%;
    background: repeating-linear-gradient(
        45deg,
        #ff00ff 0px,
        #000 3px,
        #00ffff 6px,
        #000 9px
    );
    opacity: 0.12;
    animation: bgShift 0.15s infinite linear;
    mix-blend-mode: difference;
}

@keyframes bgShift {
    0% { transform: translate(0,0) rotate(0deg); }
    25% { transform: translate(-10px,5px) rotate(1deg); }
    50% { transform: translate(10px,-5px) rotate(-1deg); }
    75% { transform: translate(-5px,-10px) rotate(0.5deg); }
    100% { transform: translate(0,0) rotate(0deg); }
}

/* Scanlines */
body::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
        0deg,
        rgba(255,255,255,0.03),
        rgba(0,0,0,0.03) 2px
    );
    pointer-events: none;
}

/* Container */
.wrapper {
    text-align: center;
    z-index: 2;
}

/* Titel mit stärkerem Glitch */
h1 {
    font-size: 70px;
    text-transform: uppercase;
    letter-spacing: 12px;
    animation: glitch 0.6s infinite;
    position: relative;
}

h1::before,
h1::after {
    content: "sigma 67";
    position: absolute;
    left: 0;
    width: 100%;
    overflow: hidden;
}

h1::before {
    color: red;
    transform: translate(-3px, 2px);
    animation: glitchShift 0.3s infinite;
}

h1::after {
    color: cyan;
    transform: translate(3px, -2px);
    animation: glitchShift 0.25s infinite reverse;
}

@keyframes glitch {
    0% { filter: contrast(120%); }
    50% { filter: contrast(200%) saturate(150%); }
    100% { filter: contrast(120%); }
}

@keyframes glitchShift {
    0% { clip-path: inset(0 0 80% 0); }
    20% { clip-path: inset(10% 0 60% 0); }
    40% { clip-path: inset(30% 0 30% 0); }
    60% { clip-path: inset(50% 0 10% 0); }
    80% { clip-path: inset(0 0 0 0); }
    100% { clip-path: inset(0 0 80% 0); }
}

/* Links */
.links {
    margin-top: 40px;
}

a {
    display: block;
    color: white;
    text-decoration: none;
    margin: 12px;
    font-size: 22px;
    letter-spacing: 3px;
    transition: 0.2s;
    filter: blur(0.6px);
}

a:hover {
    transform: scale(1.4) rotate(-2deg);
    color: #00ffff;
    text-shadow: 0 0 15px #ff00ff, 0 0 25px #00ffff;
    filter: blur(0px);
}

/* kleiner "flicker" Effekt */
@keyframes flicker {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.85; }
}

.wrapper {
    animation: flicker 2s infinite;
}
</style>

</head>

<body>

<div class="wrapper">
    <h1>sigma 67</h1>

    <div class="links">
        <a href="https://www.tiktok.com/@thesteve2017" target="_blank">TikTok</a>
        <a href="https://open.spotify.com/intl-de/artist/6PFmHjNQRtdGAKw7Uyd5qO" target="_blank">Spotify</a>
        <a href="https://selbsthilfe-hier-buchen.webnode.page/" target="_blank">???</a>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGMA 67 // CORE SYSTEM</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: black;
    font-family: "Orbitron", sans-serif;
    color: white;
}

/* MATRIX */
canvas {
    position: absolute;
    inset: 0;
    z-index: 0;
}

/* FLASH */
.flash {
    position: absolute;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    animation: flash 6s infinite;
}
@keyframes flash {
    0%, 97%, 100% { opacity: 0; }
    98% { opacity: 0.15; }
}

/* CENTER */
.wrapper {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    animation: flicker 2s infinite;
}
@keyframes flicker {
    0%,100% { opacity: 1; }
    50% { opacity: 0.6; }
}

h1 {
    font-size: 100px;
    letter-spacing: 22px;
    text-shadow: 0 0 10px cyan, 0 0 25px magenta, 0 0 40px #00ff88;
    animation: shake 0.15s infinite;
}
@keyframes shake {
    0% { transform: translate(0,0); }
    50% { transform: translate(3px,-2px); }
    100% { transform: translate(0,0); }
}

/* LINKS */
.links a {
    display: block;
    margin: 10px;
    font-family: "Share Tech Mono", monospace;
    color: #00ffcc;
    text-decoration: none;
    letter-spacing: 3px;
}
.links a:hover {
    transform: scale(1.4) rotate(-3deg);
    text-shadow: 0 0 10px cyan;
}

/* TERMINAL */
.terminal {
    position: absolute;
    bottom: 15px;
    right: 15px;
    font-family: monospace;
    font-size: 11px;
    color: #00ff88;
    opacity: 0.7;
}

/* CURSOR */
.cursor {
    position: fixed;
    width: 10px;
    height: 10px;
    background: cyan;
    border-radius: 50%;
    mix-blend-mode: difference;
    pointer-events: none;
}

/* CORE PANEL */
.core-panel {
    position: absolute;
    bottom: 15px;
    left: 15px;
    width: 260px;
    padding: 12px;
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(0,255,200,0.3);
    font-family: "Share Tech Mono", monospace;
    color: #00ffcc;
    z-index: 5;
    backdrop-filter: blur(6px);
}

.core-title {
    font-size: 12px;
    margin-bottom: 8px;
}

.core-panel button {
    width: 100%;
    margin: 4px 0;
    background: transparent;
    border: 1px solid rgba(0,255,200,0.2);
    color: #00ffcc;
    padding: 6px;
    cursor: pointer;
    font-size: 11px;
    text-align: left;
}

.core-panel button:hover {
    background: rgba(0,255,200,0.1);
}

#gameArea {
    margin-top: 10px;
    min-height: 70px;
    font-size: 11px;
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>
<div class="flash"></div>
<div class="cursor" id="cursor"></div>

<div class="wrapper">
    <h1>SIGMA 67</h1>

    <div class="links">
        <a href="https://www.tiktok.com/@thesteve2017">TT NODE</a>
        <a href="https://soundcloud.com/stxve17">SC STREAM</a>
        <a href="https://selbsthilfe-hier-buchen.webnode.page/">UNKNOWN ACCESS</a>
    </div>
</div>

<div class="terminal" id="terminal">> booting core system...</div>

<div class="core-panel" id="corePanel">
    <div class="core-title">SIGMA CORE // MODULES</div>

    <button onclick="toggleGame('reaction')">> reaction test</button>
    <button onclick="toggleGame('cipher')">> cipher unlock</button>
    <button onclick="toggleGame('void')">> void clicker</button>

    <div id="gameArea"></div>
</div>

<script>
/* CURSOR */
document.addEventListener("mousemove", e => {
    const c = document.getElementById("cursor");
    c.style.left = e.clientX + "px";
    c.style.top = e.clientY + "px";
});

/* TERMINAL */
const lines = [
"> syncing reality...",
"> loading sigma core...",
"> glyph engine active",
"> emotional suppression ON",
"> system unstable"
];

setInterval(() => {
    document.getElementById("terminal").textContent =
        lines[Math.floor(Math.random() * lines.length)];
}, 1200);

/* MATRIX */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = (
"01ABCDEFGHIJKLMNOPQRSTUVWXYZαβγδεζηθικλμνξοπρστυφχψω" +
"日月火水木金土アイウエオカキクケコサシスセソ" +
"!@#$%^&*<>?/\\|"
).split("");

const fontSize = 14;
const columns = canvas.width / fontSize;
const drops = Array(Math.floor(columns)).fill(1);

function draw() {
    ctx.fillStyle = "rgba(0,0,0,0.06)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "#00ff88";
    ctx.font = fontSize + "px monospace";

    for (let i=0;i<drops.length;i++) {
        const text = letters[Math.floor(Math.random()*letters.length)];
        ctx.fillText(text, i*fontSize, drops[i]*fontSize);

        if (drops[i]*fontSize > canvas.height && Math.random()>0.97)
            drops[i]=0;

        drops[i]+=0.8;
    }
}
setInterval(draw, 33);

/* GAMES */
let active = null;
let clicks = 0;

function toggleGame(name){
    const area = document.getElementById("gameArea");

    if(active===name){
        area.innerHTML="";
        active=null;
        return;
    }

    active=name;

    if(name==="reaction"){
        area.innerHTML="wait...";
        setTimeout(()=>{
            const start=Date.now();
            area.innerHTML="CLICK!";
            area.onclick=()=>{
                area.innerHTML="reaction: "+(Date.now()-start)+"ms";
            };
        }, Math.random()*3000+1000);
    }

    if(name==="cipher"){
        area.innerHTML=`
        <div>01001011 01001111 01000100</div>
        <input id="c" placeholder="decode"/>
        <button onclick="check()">verify</button>
        `;
    }

    if(name==="void"){
        area.innerHTML=`<div>clicks: <span id="v">0</span></div>`;
        area.onclick=()=>{
            clicks++;
            document.getElementById("v").textContent=clicks;
        };
    }
}

function check(){
    const v=document.getElementById("c").value.toUpperCase();
    document.getElementById("gameArea").innerHTML =
        v==="KOD" ? "ACCESS GRANTED" : "DENIED";
}
</script>

</body>
</html>

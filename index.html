<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SIGMA 67 // CORE SYSTEM</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: black;
    font-family: "Orbitron", sans-serif;
    color: white;
}

/* MATRIX CANVAS */
canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
}

/* FLASH */
.flash {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    animation: flash 6s infinite;
}
@keyframes flash {
    0%, 97%, 100% { opacity: 0; }
    98% { opacity: 0.15; }
}

/* CENTER */
.wrapper {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

h1 {
    font-size: 100px;
    letter-spacing: 22px;
    text-shadow: 0 0 10px cyan, 0 0 25px magenta, 0 0 40px #00ff88;
}

/* LINKS */
.links a {
    display: block;
    margin: 10px;
    font-family: "Share Tech Mono", monospace;
    color: #00ffcc;
    text-decoration: none;
}
.links a:hover {
    transform: scale(1.3) rotate(-3deg);
}

/* TERMINAL */
.terminal {
    position: fixed;
    bottom: 15px;
    right: 15px;
    font-family: monospace;
    font-size: 11px;
    color: #00ff88;
    opacity: 0.8;
    z-index: 5;
}

/* CURSOR */
.cursor {
    position: fixed;
    width: 10px;
    height: 10px;
    background: cyan;
    border-radius: 50%;
    mix-blend-mode: difference;
    pointer-events: none;
    z-index: 10;
}

/* CORE PANEL */
.core-panel {
    position: fixed;
    bottom: 15px;
    left: 15px;
    width: 280px;
    padding: 12px;
    background: rgba(0,0,0,0.65);
    border: 1px solid rgba(0,255,200,0.3);
    font-family: "Share Tech Mono", monospace;
    color: #00ffcc;
    z-index: 6;
    backdrop-filter: blur(6px);
}

.core-title {
    font-size: 12px;
    margin-bottom: 8px;
}

button {
    width: 100%;
    margin: 4px 0;
    background: transparent;
    border: 1px solid rgba(0,255,200,0.2);
    color: #00ffcc;
    padding: 6px;
    cursor: pointer;
    font-size: 11px;
    text-align: left;
}

button:hover {
    background: rgba(0,255,200,0.1);
}

#gameArea {
    margin-top: 10px;
    min-height: 70px;
    font-size: 11px;
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>
<div class="flash"></div>
<div class="cursor" id="cursor"></div>

<div class="wrapper">
    <h1>SIGMA 67</h1>

    <div class="links">
        <a href="https://www.tiktok.com/@thesteve2017">TT NODE</a>
        <a href="https://soundcloud.com/stxve17">SC STREAM</a>
        <a href="https://selbsthilfe-hier-buchen.webnode.page/">UNKNOWN ACCESS</a>
    </div>
</div>

<div class="terminal" id="terminal">> booting core...</div>

<div class="core-panel">
    <div class="core-title">SIGMA CORE // MODULES</div>

    <button onclick="toggle('reaction')">> reaction test</button>
    <button onclick="toggle('cipher')">> cipher unlock</button>
    <button onclick="toggle('void')">> void clicker</button>

    <div id="gameArea"></div>
</div>

<script>
/* CURSOR */
document.addEventListener("mousemove", e => {
    const c = document.getElementById("cursor");
    c.style.left = e.clientX + "px";
    c.style.top = e.clientY + "px";
});

/* TERMINAL */
const lines = [
"> syncing reality...",
"> sigma core active",
"> glyph engine loaded",
"> emotion layer OFF",
"> system unstable"
];

setInterval(() => {
    document.getElementById("terminal").textContent =
        lines[Math.floor(Math.random()*lines.length)];
}, 1200);

/* MATRIX FIXED FULLSCREEN */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

const fontSize = 14;
let columns;
let drops;

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    columns = Math.floor(canvas.width / fontSize);
    drops = Array(columns).fill(1);
}

window.addEventListener("resize", resize);
document.addEventListener("fullscreenchange", resize);
resize();

const letters = (
"01ABCDEFGHIJKLMNOPQRSTUVWXYZ" +
"αβγδεζηθικλμνξοπρστυφχψω" +
"日月火水木金土" +
"アイウエオカキクケコサシスセソ" +
"!@#$%^&*<>?/\\|"
).split("");

function draw() {
    ctx.fillStyle = "rgba(0,0,0,0.06)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "#00ff88";
    ctx.font = fontSize + "px monospace";

    for (let i=0;i<drops.length;i++) {
        const text = letters[Math.floor(Math.random()*letters.length)];
        ctx.fillText(text, i*fontSize, drops[i]*fontSize);

        if (drops[i]*fontSize > canvas.height && Math.random()>0.975)
            drops[i]=0;

        drops[i]+=0.9;
    }
}
setInterval(draw, 33);

/* MINIGAMES */
let active = null;
let clicks = 0;

function toggle(name){
    const g = document.getElementById("gameArea");

    if(active===name){
        g.innerHTML="";
        active=null;
        return;
    }

    active=name;

    if(name==="reaction"){
        g.innerHTML="wait signal...";
        setTimeout(()=>{
            const t=Date.now();
            g.innerHTML="CLICK!";
            g.onclick=()=>{
                g.innerHTML="reaction: "+(Date.now()-t)+"ms";
            };
        }, Math.random()*3000+1000);
    }

    if(name==="cipher"){
        g.innerHTML=`
        <div>01001011 01001111 01000100</div>
        <input id="in" placeholder="decode"/>
        <button onclick="check()">verify</button>
        `;
    }

    if(name==="void"){
        g.innerHTML=`clicks: <span id="c">0</span>`;
        g.onclick=()=>{
            clicks++;
            document.getElementById("c").textContent=clicks;
        };
    }
}

function check(){
    const v=document.getElementById("in").value.toUpperCase();
    document.getElementById("gameArea").innerHTML =
        v==="KOD" ? "ACCESS GRANTED" : "DENIED";
}
</script>

</body>
</html>
